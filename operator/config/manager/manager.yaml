apiVersion: v1
kind: Namespace
metadata:
  name: cassandra-room-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra-room-operator
  namespace: cassandra-room-system
  labels:
    app.kubernetes.io/name: cassandra-room-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cassandra-room-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cassandra-room-operator
    spec:
      serviceAccountName: cassandra-room-operator
      securityContext:
        runAsNonRoot: true
      containers:
      - name: manager
        image: ghcr.io/pbonard/cassandra-room-operator:latest
        args:
        - manager
        - --leader-elect
        # A data plane only (in a cluster the control plane manages remotely):
        # - --control-plane=false
        env:
        - name: OPERATOR_IMAGE
          value: ghcr.io/pbonard/cassandra-room-operator:latest
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: metrics
          containerPort: 8080
        livenessProbe:
          httpGet: {path: /healthz, port: 8081}
        readinessProbe:
          httpGet: {path: /readyz, port: 8081}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
