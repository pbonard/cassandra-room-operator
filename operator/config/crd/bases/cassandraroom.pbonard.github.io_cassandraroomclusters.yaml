                  description: DatacenterTemplate is a data center of a cluster.
                  properties:
                    config:
                      description: Config overrides the cluster's for this data center.
                      properties:
                        authorizer:
                          description: |-
                            Authorizer is AllowAllAuthorizer or CassandraAuthorizer (the
                            default). The authenticator is always PasswordAuthenticator.
                          enum:
                          - AllowAllAuthorizer
                          - CassandraAuthorizer
                          type: string
                        commitlogSync:
                          description: CommitlogSync is "periodic" (the default) or
                            "batch".
                          enum:
                          - periodic
                          - batch
                          type: string
                        commitlogSyncPeriod:
                          description: CommitlogSyncPeriod is the fsync period in
                            periodic mode ("10s").
                          type: string
                        extraArgs:
                          description: |-
                            ExtraArgs are further server flags ("-name=value"), after the
                            operator's.
                          items:
                            type: string
                          type: array
                        memtableSpace:
                          anyOf:
                          - type: integer
                          - type: string
                          description: |-
                            MemtableSpace bounds the memtables of all tables
                            (memtable_heap_space).
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        numTokens:
                          description: NumTokens is the number of vnodes of each node
                            (num_tokens).
                          format: int32
                          type: integer
                      type: object
                    k8sContext:
                      description: |-
                        K8sContext is the ClientConfig of the Kubernetes cluster running the
                        data center (empty: the control plane's own).
                      type: string
                    name:
                      description: Name of the data center in cassandra-room.
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    namespace:
                      description: 'Namespace in that cluster (default: the cluster
