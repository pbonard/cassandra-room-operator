---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: cassandraroomclusters.cassandraroom.pbonard.github.io
spec:
  group: cassandraroom.pbonard.github.io
  names:
    kind: CassandraRoomCluster
    listKind: CassandraRoomClusterList
    plural: cassandraroomclusters
    shortNames:
    - crc
    singular: cassandraroomcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CassandraRoomCluster is a cassandra-room cluster across data centers and
          Kubernetes clusters.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CassandraRoomClusterSpec is a cassandra-room cluster of one or more data
              centers, each in the Kubernetes cluster its K8sContext names
              (k8ssandra-operator's K8ssandraCluster). The cluster's controller runs in
              one Kubernetes cluster (the control plane) and creates a
              CassandraRoomDatacenter in each data center's cluster, whose operator
              (the data plane) runs it.
            properties:
              agentImage:
                description: |-
                  AgentImage is the operator's image for the nodes' init and backup
                  containers (default: the operator's own).
                type: string
              backup:
                description: Backup is the object store the clusters' backups go to.
                properties:
                  bucket:
                    type: string
                  concurrency:
                    description: |-
                      Concurrency is the number of files a node uploads or downloads at
                      once (default 4).
                    format: int32
                    type: integer
                  credentialsSecret:
                    description: |-
                      CredentialsSecret holds access_key_id and secret_access_key; without
                      it, the default AWS credential chain (IRSA, instance role) applies.
                    properties:
                      secretName:
                        type: string
                    required:
                    - secretName
                    type: object
                  endpoint:
                    description: Endpoint of an S3-compatible store (MinIO...); empty
                      for AWS.
                    type: string
                  forcePathStyle:
                    description: ForcePathStyle addresses buckets by path (MinIO).
                    type: boolean
                  prefix:
                    description: 'Prefix of the objects (default: none).'
                    type: string
                  region:
                    type: string
                required:
                - bucket
                type: object
              config:
                description: Config applies to every data center, under its own.
                properties:
                  authorizer:
                    description: |-
                      Authorizer is AllowAllAuthorizer or CassandraAuthorizer (the
                      default). The authenticator is always PasswordAuthenticator.
                    enum:
                    - AllowAllAuthorizer
                    - CassandraAuthorizer
                    type: string
                  commitlogSync:
                    description: CommitlogSync is "periodic" (the default) or "batch".
                    enum:
                    - periodic
                    - batch
                    type: string
                  commitlogSyncPeriod:
                    description: CommitlogSyncPeriod is the fsync period in periodic
                      mode ("10s").
                    type: string
                  extraArgs:
                    description: |-
                      ExtraArgs are further server flags ("-name=value"), after the
                      operator's.
                    items:
                      type: string
                    type: array
                  memtableSpace:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      MemtableSpace bounds the memtables of all tables
                      (memtable_heap_space).
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  numTokens:
                    description: NumTokens is the number of vnodes of each node (num_tokens).
                    format: int32
                    type: integer
                type: object
              datacenters:
                description: |-
                  Datacenters are created in order, each once the previous ones are
                  ready.
