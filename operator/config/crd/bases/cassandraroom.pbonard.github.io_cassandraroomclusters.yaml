                          description: |-
                            AllowMultipleNodesPerWorker lets two cassandra-room nodes share a
                            Kubernetes node (by default they repel each other).
                          type: boolean
                        nodeSelector:
                          additionalProperties:
                            type: string
                          type: object
                        resources:
                          description: ResourceRequirements describes the compute
                            resource requirements.
                          properties:
                            claims:
                              description: |-
                                Claims lists the names of resources, defined in spec.resourceClaims,
                                that are used by this container.

                                This is an alpha field and requires enabling the
                                DynamicResourceAllocation feature gate.

                                This field is immutable. It can only be set for containers.
                              items:
                                description: ResourceClaim references one entry in
                                  PodSpec.ResourceClaims.
                                properties:
                                  name:
                                    description: |-
                                      Name must match the name of one entry in pod.spec.resourceClaims of
                                      the Pod where this field is used. It makes that resource available
                                      inside a container.
                                    type: string
                                  request:
                                    description: |-
                                      Request is the name chosen for a request in the referenced claim.
                                      If empty, everything from the claim is made available, otherwise
                                      only the result of this request.
                                    type: string
                                required:
                                - name
                                type: object
                              type: array
                              x-kubernetes-list-map-keys:
                              - name
                              x-kubernetes-list-type: map
                            limits:
                              additionalProperties:
                                anyOf:
                                - type: integer
                                - type: string
                                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                x-kubernetes-int-or-string: true
                              description: |-
                                Limits describes the maximum amount of compute resources allowed.
                                More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                              type: object
                            requests:
                              additionalProperties:
                                anyOf:
                                - type: integer
                                - type: string
                                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                x-kubernetes-int-or-string: true
                              description: |-
                                Requests describes the minimum amount of compute resources required.
                                If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                                otherwise to an implementation-defined value. Requests cannot exceed Limits.
                                More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                              type: object
                          type: object
                        serviceAccountName:
                          description: |-
                            ServiceAccountName runs the pods as this service account (default:
                            one the operator creates).
                          type: string
                        tolerations:
                          items:
                            description: |-
                              The pod this Toleration is attached to tolerates any taint that matches
                              the triple <key,value,effect> using the matching operator <operator>.
                            properties:
                              effect:
                                description: |-
                                  Effect indicates the taint effect to match. Empty means match all taint effects.
                                  When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                                type: string
                              key:
                                description: |-
                                  Key is the taint key that the toleration applies to. Empty means match all taint keys.
                                  If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                                type: string
                              operator:
                                description: |-
                                  Operator represents a key's relationship to the value.
                                  Valid operators are Exists and Equal. Defaults to Equal.
                                  Exists is equivalent to wildcard for value, so that a pod can
                                  tolerate all taints of a particular category.
                                type: string
                              tolerationSeconds:
                                description: |-
                                  TolerationSeconds represents the period of time the toleration (which must be
                                  of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                                  it is not set, which means tolerate the taint forever (do not evict). Zero and
                                  negative values will be treated as 0 (evict immediately) by the system.
                                format: int64
                                type: integer
                              value:
                                description: |-
                                  Value is the taint value the toleration matches to.
                                  If the operator is Exists, the value should be empty, otherwise just a regular string.
                                type: string
                            type: object
                          type: array
                      type: object
                    racks:
                      items:
                        description: |-
                          Rack is a failure domain of a data center: its nodes are spread evenly
                          over the racks, and replicas over racks.
                        properties:
                          name:
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                          nodeAffinityLabels:
                            additionalProperties:
                              type: string
                            description: |-
                              NodeAffinityLabels place the rack's pods on nodes with these labels
                              (for instance a zone).
                            type: object
                        required:
                        - name
                        type: object
                      type: array
                    replaceNodes:
                      items:
                        type: string
                      type: array
                    rollingRestartRequestedAt:
                      type: string
                    size:
                      format: int32
                      minimum: 0
                      type: integer
                    stopped:
                      type: boolean
                    storage:
                      description: StorageSpec is each node's data volume.
                      properties:
                        size:
                          anyOf:
                          - type: integer
                          - type: string
                          description: Size of the volume (default 10Gi).
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        storageClassName:
                          type: string
                      type: object
                  required:
                  - name
                  - size
                  type: object
                minItems: 1
                type: array
              image:
                description: Image of cassandra-room.
                type: string
              imagePullPolicy:
                type: string
              imagePullSecrets:
                items:
                  description: SecretRef names a secret.
                  properties:
                    secretName:
                      type: string
                  required:
                  - secretName
                  type: object
                type: array
              networking:
                description: NetworkingSpec configures addresses.
                properties:
                  loadBalancerAnnotations:
                    additionalProperties:
                      type: string
                    description: |-
                      LoadBalancerAnnotations are put on the per-node Services
                      (LoadBalancer mode), for instance to make them internal.
                    type: object
                  mode:
                    description: Mode is PodIP (the default), HostNetwork or LoadBalancer.
                    enum:
                    - PodIP
                    - HostNetwork
                    - LoadBalancer
                    type: string
                  preferLocal:
                    description: |-
                      PreferLocal makes nodes of a data center connect to each other at
                      their pod addresses (with HostNetwork or LoadBalancer).
                    type: boolean
                type: object
              repairs:
                description: Repairs are scheduled repairs, run from the first data
                  center.
                items:
                  description: RepairTemplate is a scheduled repair of the cluster.
                  properties:
                    name:
                      description: Name of the RepairSchedule created (prefixed by
                        the cluster's).
                      type: string
                    spec:
                      description: |-
                        RepairScheduleSettings are how and when a cluster is repaired (Reaper's
                        repair schedules): each run splits the ring into segments and repairs
                        them one by one through the nodes' management API, with pauses that
                        keep the load down.
                      properties:
                        history:
                          description: History is the number of finished runs kept
                            in the status (default 10).
                          format: int32
                          type: integer
                        intensity:
                          description: |-
                            Intensity in (0, 1]: after a segment taking d, the run pauses
                            d*(1/intensity-1) (default "1": no pause).
                          type: string
                        keyspaces:
                          description: 'Keyspaces to repair (default: every user keyspace).'
                          items:
                            type: string
                          type: array
                        maxRetries:
                          description: MaxRetries of a failing segment before it is
                            given up (default 3).
                          format: int32
                          type: integer
                        parallelism:
                          description: |-
                            Parallelism is the number of segments repaired at once, on
                            different nodes (default 1).
                          format: int32
                          type: integer
                        paused:
                          description: Paused stops starting segments; a run resumes
                            where it stopped.
                          type: boolean
                        runRequestedAt:
                          description: RunRequestedAt starts a run now when it changes.
                          type: string
                        schedule:
                          description: Schedule is a cron expression (default "@weekly").
                          type: string
                        segmentTimeout:
                          description: SegmentTimeout bounds a segment's repair (default
                            30m).
                          type: string
                        segmentsPerNode:
                          description: |-
                            SegmentsPerNode splits each node's share of a keyspace's ring into
                            this many segments (default 16).
                          format: int32
                          type: integer
                      type: object
                  required:
                  - name
                  - spec
                  type: object
                type: array
              superuserSecret:
                description: |-
                  SuperuserSecret holds the superuser's username and password (default
                  <name>-superuser, created with a random password and copied to
                  every data center's cluster).
                type: string
              tls:
                description: |-
                  TLSSpec configures encryption, from secrets of type kubernetes.io/tls
                  holding tls.crt, tls.key and ca.crt (as cert-manager writes them). In
                  a multi-cluster deployment, each secret must exist in every cluster.
                properties:
                  client:
                    description: Client encrypts the native protocol port.
                    properties:
                      optional:
                        description: Optional also accepts unencrypted clients on
                          the same port.
                        type: boolean
                      requireClientAuth:
                        description: |-
                          RequireClientAuth requires client certificates signed by the
                          secret's ca.crt.
                        type: boolean
                      secretName:
                        type: string
                    required:
                    - secretName
                    type: object
                  internode:
                    description: |-
                      Internode encrypts the connections between nodes, mutually
                      authenticated.
                    properties:
                      secretName:
                        type: string
                      verifyHostname:
                        description: |-
                          VerifyHostname also checks peers' certificate names
                          (require_endpoint_verification).
                        type: boolean
                    required:
                    - secretName
                    type: object
                  management:
                    description: |-
                      Management encrypts the management API; the operator and the
                      backup agent present the same secret's certificate.
                    properties:
                      secretName:
                        type: string
                    required:
                    - secretName
                    type: object
                type: object
            required:
            - datacenters
            - image
            type: object
          status:
            description: CassandraRoomClusterStatus is the observed state of a cluster.
            properties:
              cmsMembers:
                description: CMSMembers are the metadata service's members the operator
                  chose.
                items:
                  type: string
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              datacenters:
                items:
                  description: DatacenterSummary is a data center's state, seen from
                    the control plane.
                  properties:
                    k8sContext:
                      type: string
                    name:
                      type: string
                    phase:
                      description: DatacenterPhase is a data center's state.
                      type: string
                    readyNodes:
                      format: int32
                      type: integer
                    seeds:
                      items:
                        type: string
                      type: array
                    size:
                      format: int32
                      type: integer
                  required:
                  - name
                  - readyNodes
                  - size
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: DatacenterPhase is a data center's state.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
