---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: cassandraroomrestores.cassandraroom.pbonard.github.io
spec:
  group: cassandraroom.pbonard.github.io
  names:
    kind: CassandraRoomRestore
    listKind: CassandraRoomRestoreList
    plural: cassandraroomrestores
    shortNames:
    - crrestore
    singular: cassandraroomrestore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.cluster
      name: Cluster
      type: string
    - jsonPath: .spec.backup
      name: Backup
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CassandraRoomRestore restores a backup into a cluster. Clients should not
          write to the restored tables meanwhile.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CassandraRoomRestoreSpec restores a backup into a cluster.
            properties:
              backup:
                description: |-
                  Backup is the CassandraRoomBackup's name or, with SourceCluster, the
                  backup's name in the object store.
                type: string
              cluster:
                type: string
              consistency:
                description: Consistency of Load's writes (default ALL).
                type: string
              keyspaces:
                description: 'Keyspaces to restore (default: every keyspace of the
                  backup).'
                items:
                  type: string
                type: array
              mode:
                description: Mode is Import (default) or Load.
                enum:
                - Import
                - Load
                type: string
              pointInTime:
                description: |-
                  PointInTime restores the cluster as it was at this time: the backup,
                  then each node's archived commit log up to it, leaving out what was
                  written later (by write timestamp). Import only; the backup must be
                  the last one before it, and the data centers' backup storage must
                  archive commit logs.
                format: date-time
                type: string
              sourceCluster:
                description: |-
                  SourceCluster restores a backup of another cluster (its name in the
                  object store, which must be the same bucket): Load only. The tables
                  must exist (create the schema first).
                type: string
              sourceDatacenter:
                description: |-
                  SourceDatacenter is the backup's data center that Load reads
                  (default: its first). Each data center holds every row it
                  replicates, so one suffices when it replicates every keyspace.
                type: string
            required:
            - backup
            - cluster
            type: object
          status:
            description: CassandraRoomRestoreStatus is a cluster restore's state.
            properties:
              datacenters:
                items:
                  description: |-
                    DatacenterProgress is a data center's part of a cluster-wide backup or
                    restore.
                  properties:
                    bytes:
                      format: int64
                      type: integer
                    done:
                      format: int32
                      type: integer
                    name:
                      type: string
                    nodes:
                      format: int32
                      type: integer
                    phase:
                      description: BackupPhase is a backup's or restore's state.
                      type: string
                  required:
                  - bytes
                  - done
                  - name
                  - nodes
                  type: object
                type: array
              finishedAt:
                format: date-time
                type: string
              message:
                type: string
              phase:
                description: BackupPhase is a backup's or restore's state.
                type: string
              startedAt:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
