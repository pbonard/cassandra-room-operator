apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - events
  - persistentvolumeclaims
  - pods
  - secrets
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cassandraroom.pbonard.github.io
  resources:
  - cassandraroombackups
  - cassandraroombackups/finalizers
  - cassandraroombackups/status
  - cassandraroombackupschedules
  - cassandraroombackupschedules/status
  - cassandraroomclusters
  - cassandraroomclusters/finalizers
  - cassandraroomclusters/status
  - cassandraroomdatacenters
  - cassandraroomdatacenters/finalizers
  - cassandraroomdatacenters/status
  - cassandraroomrestores
  - cassandraroomrestores/status
  - clientconfigs
  - datacenterbackups
  - datacenterbackups/finalizers
  - datacenterbackups/status
  - datacenterrestores
  - datacenterrestores/finalizers
  - datacenterrestores/status
  - repairschedules
  - repairschedules/status
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - bind
  - create
  - delete
  - escalate
  - get
  - list
  - patch
  - update
  - watch
